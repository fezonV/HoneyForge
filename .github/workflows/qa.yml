name: HoneyForge QA

on:
  pull_request:
  push:
    branches: [dev, main, QA-04]

permissions:
  contents: read

jobs:
  backend:
    name: Go, schema and static checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: honeyforge
          POSTGRES_PASSWORD: qa04-password
          POSTGRES_DB: honeyforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyforge -d honeyforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://honeyforge:qa04-password@127.0.0.1:5432/honeyforge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -d $(git ls-files '*.go'))"
      - name: Test with race detector
        run: go test -race -short -count=1 ./...
      - name: Vet and build
        run: |
          go vet ./...
          go build ./...
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
      - name: Validate Compose model
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_WITH_RANDOM_URI_SAFE_VALUE/qa04-password/g' .env
          docker compose config -q

  web:
    name: Web build, lint and browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Build and lint web
        run: |
          npm --prefix web run build
          npm --prefix web run lint
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: npm --prefix web run test:e2e -- e2e/trap-realtime.spec.mjs e2e/trap-control.spec.mjs e2e/profile-preview.spec.mjs --reporter=line
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa04-browser-smoke
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  live-e2e:
    name: Live API and Low/Medium E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: honeyforge
          POSTGRES_PASSWORD: qa04-password
          POSTGRES_DB: honeyforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyforge -d honeyforge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://honeyforge:qa04-password@127.0.0.1:5432/honeyforge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Install browser and run live smoke
        run: |
          cd web
          npx playwright install --with-deps chromium
          npm run test:e2e -- e2e/trap-park.spec.mjs --reporter=line
      - name: Upload live E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa04-live-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  compose-health:
    name: Clean Compose startup and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start clean local stack
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_WITH_RANDOM_URI_SAFE_VALUE/qa04-password/g' .env
          trap 'docker compose logs --no-color; docker compose down -v --remove-orphans' EXIT
          docker compose up -d --build
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:8081/readyz
