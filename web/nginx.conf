# Конфигурация Nginx для HoneyForge Web-UI и reverse-proxy (BE-04 / MASK-2)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие gzip для статики интерфейса
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Маршрутизация SPA: все прямые переходы на роуты (/overview, /profiles, /traps, /events, /audit)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование REST API к backend Control API (FastAPI)
    location /api/ {
        proxy_pass http://control-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Проксирование WebSocket для Realtime потока событий атак
    location /ws {
        proxy_pass http://control-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
