name: honeyforge-secure

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-honeyforge}
      POSTGRES_USER: ${POSTGRES_USER:-honeyforge}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - honeyforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeyforge} -d ${POSTGRES_DB:-honeyforge}"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    networks: [backend]
    restart: unless-stopped

  control:
    build:
      context: ..
      dockerfile: Dockerfile.control
      args:
        HF_SOURCE_REVISION: ${HF_SOURCE_REVISION:-unknown}
    environment:
      DATABASE_URL_FILE: /run/secrets/control_database_url
      LISTEN_ADDR: 0.0.0.0:8081
      PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST}:${MANAGEMENT_PORT:-8443}
      AGENT_ORIGIN: https://${PUBLIC_HOST}:${AGENT_PORT:-9443}
      COOKIE_SECURE: "true"
      GEOIP_CITY_DB: ${GEOIP_CITY_DB:-}
      GEOIP_ASN_DB: ${GEOIP_ASN_DB:-}
      GEOIP_SOURCE: ${GEOIP_SOURCE:-}
      GEOIP_VERSION: ${GEOIP_VERSION:-}
    secrets: [control_database_url]
    volumes:
      - ${GEOIP_DATA_DIR:-../geoip}:/var/lib/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    networks: [backend, management]
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [frontend]
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    user: "101:101"
    depends_on:
      control:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${MANAGEMENT_PORT:-8443}:8443"
      - "${AGENT_BIND_ADDRESS:-127.0.0.1}:${AGENT_PORT:-9443}:9443"
    secrets: [tls_certificate, tls_private_key]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && nginx -t"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks: [edge, management, frontend]
    restart: unless-stopped

volumes:
  honeyforge-pgdata:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password}
  control_database_url:
    file: ${CONTROL_DATABASE_URL_FILE:-./secrets/control_database_url}
  tls_certificate:
    file: ${TLS_CERT_FILE:-./secrets/tls.crt}
  tls_private_key:
    file: ${TLS_KEY_FILE:-./secrets/tls.key}

networks:
  edge:
    driver: bridge
  management:
    internal: true
  frontend:
    internal: true
  backend:
    internal: true
  attack:
    internal: true
